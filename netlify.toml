[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/api/*"
  to = "https://a-melevent.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:page.html"
  to = "/:page"
  status = 301
  force = true

[[redirects]]
  from = "/hub.app"
  to = "/hubapp.html"
  status = 200

[[redirects]]
  from = "/hubapp"
  to = "/hubapp.html"
  status = 200
